services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spotify_db
      MYSQL_USER: spotify
      MYSQL_PASSWORD: spotify_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
